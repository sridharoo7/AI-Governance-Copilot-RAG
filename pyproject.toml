[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-grounded-rag"
version = "0.1.0"
description = "Governed, citation-enforced RAG for AI governance evidence."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "pyyaml>=6,<7", "httpx>=0.27,<1", "pypdf>=5,<7", "reportlab>=4,<5",
  "weaviate-client>=4.9,<5", "sentence-transformers>=3.0,<4",
  # Ragas 0.4 imports the LangChain 0.3 Vertex adapter. Pin this compatible family so
  # evaluator imports remain reproducible instead of silently breaking on LangChain 1.x.
  "langchain>=0.3,<0.4", "langchain-core>=0.3,<0.4", "langchain-community>=0.3,<0.4",
  "langgraph>=0.2,<0.3",
  "ragas>=0.2,<1", "google-genai>=1,<2", "openai>=1.0,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
